spring.application.name=notification-service
server.port=8080

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.consumer.group-id=notificationService
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=event:com.techie.microservices.notification.order.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.techie.microservices.notification.order.event

# =========================
# Aiven SSL Configuration
# =========================
spring.kafka.properties.security.protocol=SSL

# Trust CA
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=file:/etc/secrets/ca.pem

# Client Certificate
spring.kafka.properties.ssl.keystore.type=PEM
spring.kafka.properties.ssl.keystore.certificate.chain=file:/etc/secrets/service.cert
spring.kafka.properties.ssl.keystore.key=file:/etc/secrets/service-key-pkcs8.pem

# No passwords with PEM
spring.kafka.properties.ssl.keystore.password=
spring.kafka.properties.ssl.key.password=
spring.kafka.properties.ssl.truststore.password=

# =========================
# Mailtrap
# =========================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.application.name=api-gateway
server.port=8080

# ---------------- Gateway Routes ----------------

# Product Service
spring.cloud.gateway.mvc.routes[0].id=product-service
spring.cloud.gateway.mvc.routes[0].uri=http://product-service:8080
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/product,/api/product/**

spring.cloud.gateway.mvc.routes[1].id=inventory-service
spring.cloud.gateway.mvc.routes[1].uri=http://inventory-service:8080
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/inventory,/api/inventory/**

spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=http://order-service:8080
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/order,/api/order/**

# ---------------- Swagger ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ---------------- Actuator ----------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
spring.application.name=api-gateway
server.port=8080

# Product
spring.cloud.gateway.mvc.routes[0].id=product-service
spring.cloud.gateway.mvc.routes[0].uri=${PRODUCT_SERVICE_URL}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/product,/api/product/**

# Inventory
spring.cloud.gateway.mvc.routes[1].id=inventory-service
spring.cloud.gateway.mvc.routes[1].uri=${INVENTORY_SERVICE_URL}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/inventory,/api/inventory/**

# Order
spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=${ORDER_SERVICE_URL}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/order,/api/order/**

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
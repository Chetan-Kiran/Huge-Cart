services:
  # =========================
  # DATABASES
  # =========================

  mongodb-product-service:
    image: mongo:7.0.5
    container_name: mongodb-product-service
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: product-service
    volumes:
      - mongodb-product-data:/data/db

  mysql-inventory-service:
    image: mysql:8.3.0
    container_name: mysql-inventory-service
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: inventory_service
    volumes:
      - mysql-inventory-data:/var/lib/mysql

    # Wait until MySQL accepts connections
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-order-service:
    image: mysql:8.3.0
    container_name: mysql-order-service
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: order_service
    volumes:
      - mysql-order-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =========================
  # PRODUCT SERVICE
  # =========================

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    ports:
      - "8081:8080"

    depends_on:
      mongodb-product-service:
        condition: service_started
      inventory-service:
        condition: service_healthy

    environment:
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
      INVENTORY_SERVICE_URL: http://inventory-service:8080

    restart: unless-stopped

  # =========================
  # INVENTORY SERVICE
  # =========================

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "8082:8080"

    depends_on:
      mysql-inventory-service:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-inventory-service:3306/inventory_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:8080/api/inventory?skuCode=IPH17-BLK\\&quantity=1 || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 120s

    restart: unless-stopped

  # =========================
  # ORDER SERVICE
  # =========================

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile

    container_name: order-service
    ports:
      - "8083:8080"

    depends_on:
      mysql-order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      broker:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-order-service:3306/order_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql

      INVENTORY_URL: http://inventory-service:8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092

    restart: unless-stopped

  # =========================
  # NOTIFICATION SERVICE
  # =========================

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: notification-service
    ports:
      - "8084:8080"

    depends_on:
      broker:
        condition: service_started

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092

      SPRING_MAIL_HOST: sandbox.smtp.mailtrap.io
      SPRING_MAIL_PORT: 2525
      SPRING_MAIL_USERNAME: ${MAILTRAP_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAILTRAP_PASSWORD}

    restart: unless-stopped

  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway
    ports:
      - "8088:8080"

    depends_on:
      product-service:
        condition: service_started
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_started

    environment:
      PRODUCT_SERVICE_URL: http://product-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      ORDER_SERVICE_URL: http://order-service:8080

    restart: unless-stopped

  # =========================
  # KAFKA
  # =========================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper

    ports:
      - "2181:2181"

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker

    ports:
      - "9092:9092"
      - "29092:29092"

    depends_on:
      zookeeper:
        condition: service_started

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry

    ports:
      - "8085:8081"

    depends_on:
      broker:
        condition: service_started

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8086:8080"

    depends_on:
      broker:
        condition: service_started
      schema-registry:
        condition: service_started

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  mongodb-product-data:
  mysql-inventory-data:
  mysql-order-data: